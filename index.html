<style>
:root {
  --bg: #111318; --surface: #1c1f26; --surface2: #252830; --border: #2e3240;
  --text: #e8eaf0; --text2: #8b90a0; --accent: #1db87a; --blue: #3b8ef0;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

#login-screen, #loading-screen, #error-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 24px;
}
#login-screen h2 { font-size: 22px; font-weight: 500; margin-bottom: 12px; }
#login-screen p { font-size: 14px; color: var(--text2); margin-bottom: 32px; max-width: 380px; line-height: 1.6; }
.btn-ms { display: inline-flex; align-items: center; gap: 10px; background: #0078d4; color: #fff; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; cursor: pointer; font-family: inherit; }
.btn-ms:hover { background: #006cbe; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { font-size: 14px; color: var(--text2); }

.dash-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 13px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.dash-title { display: flex; align-items: center; gap: 10px; }
.dash-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dash-title h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

.dash-body { padding: 20px 28px; max-width: 1300px; margin: 0 auto; }

.filter-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); margin-right: 4px; flex-shrink: 0; }
.filter-btn { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--text2); padding: 5px 12px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }

@media (max-width: 700px)  { .kpi-4, .kpi-2 { grid-template-columns: 1fr; } }

.kpi-card.highlight { border-color: var(--accent); }
.kpi-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }

<script>
const CLIENT_ID = '48ad5a10-625f-492f-8564-60d612e5405f';
const TENANT   = '3b704bc6-f92b-4581-a329-e1d4afa9987a';
const SCOPES   = 'Files.Read.All Sites.Read.All User.Read';
const DRIVE_ID = 'b!pmFBZLuJVkeuGzPtHmyMtMnI1MPI-WtNtZQeYhwzMrCBd7CMfYuTQKSXTAwlNDU4';
const ITEM_ID  = '01FRDE3KMK5RHCJV4F4FE3JD5SSAWLFEMT';
const REDIRECT = 'https://reporte-ventas-sc.vercel.app/';
const CONSUMOS_SHARE_URL = 'https://grupotronchetto-my.sharepoint.com/:x:/r/personal/ariel_farji_tronchetto_com_ar/_layouts/15/Doc.aspx?sourcedoc=%7B9D156B9E-4224-4565-BFF3-376D166EB1EC%7D&file=consumosEneroalprincipiodeMayo.xlsx&action=default&mobileredirect=true';
// Resumen pre-procesado por Office Script + Power Automate (ver office-script-resumen-sous-chef.ts).
// Lo genera el flujo "Resumen diario Sous Chef" (7am) en el site Comercial.
// Si el archivo no existe o no es accesible, el dashboard cae al xlsx completo (lento).
const COMERCIAL_DRIVE_ID = 'b!N3NhGotE_0Gu3lFrMvvgdxh9-H_qYK1Bu9dwusihixvmsTzehqeSSYtKVHh4x6SC';
const DATA_JSON_URL = `https://graph.microsoft.com/v1.0/drives/${COMERCIAL_DRIVE_ID}/root:` +
  encodeURI('/COMERCIAL/sous-chef-data.json') + ':/content';

let currency       = 'usd';
let activeYear     = null;   // fiscal year number or null = all
let activeMonthKey = null;   // 'YYYY-MM' or null = all months in year
let allData      = null;     // ventas file: billing data
let consumosData = null;     // consumos file: client activity + raciones
let charts       = {};

// --- PKCE ---
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function generatePKCE() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest   = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(digest) };
}

function showScreen(id) {
  ['login-screen','loading-screen','error-screen','report-screen'].forEach(s => {
    document.getElementById(s).style.display = s === id ? (s === 'report-screen' ? 'block' : 'flex') : 'none';
  });
}
function setLoading(msg) { showScreen('loading-screen'); document.getElementById('loading-msg').textContent = msg; }
function setError(msg)   { showScreen('error-screen');   document.getElementById('error-msg').textContent   = msg; }

async function doLogin() {
  const { verifier, challenge } = await generatePKCE();
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);
  const p = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPES, state, code_challenge: challenge, code_challenge_method: 'S256' });
  window.location.href = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/authorize?${p}`;
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('PKCE verifier no encontrado.');
  const body = new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: verifier });
  const res  = await fetch(`https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || `Error ${res.status}`);
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');
  return data.access_token;
}

async function handleCallback() {
  const p = new URLSearchParams(window.location.search);
  const code = p.get('code'), state = p.get('state'), error = p.get('error');
  if (error) { setError(`Error de autenticación: ${p.get('error_description') || error}`); return true; }
  if (!code) return false;
  if (state !== sessionStorage.getItem('oauth_state')) { setError('Error de seguridad: state inválido.'); return true; }
  history.replaceState(null, '', window.location.pathname);
  setLoading('Autenticando...');
  const token = await exchangeCode(code);
  sessionStorage.setItem('ms_token', token);
  await loadFile(token);
  return true;
}

async function getUser(token) {
  const res = await fetch('https://graph.microsoft.com/v1.0/me', { headers: { Authorization: 'Bearer ' + token } });
  return res.ok ? res.json() : null;
}

// --- Date helpers ---
function periodKey(d) {
  if (d instanceof Date) return d.toISOString().slice(0, 7);
  return String(d).slice(0, 7);
}
function periodLabel(k) {
  if (!k) return '';
  const [y, m] = k.split('-');
  return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][parseInt(m)-1] + '-' + y.slice(2);
}
function fiscalYear(key) {
  const [y, m] = key.split('-').map(Number);
  return m >= 11 ? y + 1 : y;
}
function fyLabel(fy) { return 'AF' + String(fy).slice(2); }
function prevMonthKey(k) {
  const [y, m] = k.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
}
function fmtDate(d) {
  if (!d || isNaN(d)) return '—';
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function fmtN(v, dec = 0) { return Number(v).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtAR(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return 'AR$ ' + (v/1e9).toFixed(1) + 'B';
  if (a >= 1e6) return 'AR$ ' + (v/1e6).toFixed(1) + 'M';
  return 'AR$ ' + fmtN(v);
}
function fmtUSD(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return 'U$S ' + (v/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return 'U$S ' + fmtN(v/1e3, 1) + 'k';
  return 'U$S ' + fmtN(v);
}

function parseMEP(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const mep  = new Map();
  let hdr = -1;
  for (let i = 0; i < rows.length; i++) {
    if (String(rows[i][1]).toLowerCase().includes('periodo')) { hdr = i; break; }
  }
  if (hdr < 0) return mep;
  for (let i = hdr + 1; i < rows.length; i++) {
    const per = rows[i][1], val = rows[i][3];
    if (!per || !val) continue;
    const d = per instanceof Date ? per : new Date(per);
    if (isNaN(d)) continue;
    mep.set(d.toISOString().slice(0, 7), Math.round(Number(val)));
  }
  return mep;
}

async function fetchShareFile(token, shareUrl) {
  const encoded = 'u!' + btoa(shareUrl).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  return fetch(`https://graph.microsoft.com/v1.0/shares/${encoded}/driveItem/content`, {
    headers: { Authorization: 'Bearer ' + token }
  });
}

// Client name normalization — unifies variants into canonical names
const CLIENT_RULES = [
  // Multi-location chains
  [/^ADP\b/i,                'ADP'],
  [/^ARAMARK/i,              'ARAMARK'],
  [/^BONAFIDE/i,             'BONAFIDE'],
  // Brand + suffix variants
  [/^CHEF POINT/i,           'CHEF POINT'],
  [/^CORPO CAF[EÉ]/i,        'CORPO CAFÉ'],
  [/^DISFRIOALAR/i,          'DISFRIOALAR'],
  [/^FEDERICO PITA/i,        'FEDERICO PITA'],
  [/^FRIKS/i,                'FRIKS'],
  [/^INSTITUTO UN LUGAR/i,   'INSTITUTO UN LUGAR'],
  [/^LA FACTORY/i,           'LA FACTORY'],
  [/^LA FERNETERIA/i,        'LA FERNETERIA'],
  [/^MELAO/i,                'MELAO'],
  [/^MUESTRA SC/i,           'MUESTRA SC'],
  [/^OREJA NEGRA/i,          'DISFRIOALAR'],
];
function normalizeClient(raw) {
  const s = String(raw).trim();
  for (const [pattern, canonical] of CLIENT_RULES) {
    if (pattern.test(s)) return canonical;
  }
  return s;
}

// Parses dates in multiple formats: JS Date, ISO string, DD-MM-YYYY, DD/MM/YYYY
function parseFlexDate(raw) {
  if (!raw) return null;
  if (raw instanceof Date) return isNaN(raw) ? null : raw;
  const s = String(raw).trim();
  // DD-MM-YYYY or DD/MM/YYYY
  const dmy = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if (dmy) {
    const d = new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);
    return isNaN(d) ? null : d;
  }
  // YYYY-MM-DD and other browser-native formats
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function parseConsumosWorkbook(wb) {
  const sheetName = wb.SheetNames.find(s => /base/i.test(s)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
  if (!rows.length) return null;

  const headers = Object.keys(rows[0]);
  const h = headers.map(x => String(x).toLowerCase().trim());
  const find = (...cands) => {
    const idx = h.findIndex(col => cands.some(c => col.includes(c)));
    return idx >= 0 ? headers[idx] : null;
  };
  const COL = {
    fecha:    find('fecha', 'emision', 'date', 'periodo fiscal', 'período'),
    cliente:  find('comedor', 'fantasia', 'cliente', 'razon', 'nombre'),
    raciones: find('raciones', 'racion', 'cantidad', 'unidades', 'qty', 'porcion'),
    udn:      find('udn', 'negocio', 'empresa', 'division'),
  };

  console.log('[consumos] sheet:', sheetName, '| columnas:', COL);

  const scRows = COL.udn
    ? rows.filter(r => String(r[COL.udn]).trim() === 'Sous Chef')
    : rows;

  // Log all unique raw client names so we can catch missing normalizations
  if (COL.cliente) {
    const rawNames = [...new Set(scRows.map(r => String(r[COL.cliente]).trim()))].sort();
    console.log('[consumos] nombres únicos SIN normalizar (' + rawNames.length + '):\n' + rawNames.join('\n'));
  }

  let skipped = 0;
  const clientsByMonth  = {};
  const clientFirstMonth = {};
  const clientMonthData = {};
  const clientLastDate  = {};

  scRows.forEach(r => {
    const date = parseFlexDate(COL.fecha ? r[COL.fecha] : null);
    if (!date) { skipped++; return; }

    const mKey    = periodKey(date);
    const client  = COL.cliente ? (normalizeClient(r[COL.cliente]) || 'Sin nombre') : 'Sin nombre';
    const raciones = COL.raciones ? (Number(r[COL.raciones]) || 0) : 1;

    if (!clientsByMonth[mKey]) clientsByMonth[mKey] = new Set();
    clientsByMonth[mKey].add(client);

    if (!clientFirstMonth[client] || mKey < clientFirstMonth[client]) clientFirstMonth[client] = mKey;

    if (!clientMonthData[mKey]) clientMonthData[mKey] = {};
    if (!clientMonthData[mKey][client]) clientMonthData[mKey][client] = { raciones: 0, lastDate: null };
    const cd = clientMonthData[mKey][client];
    cd.raciones += raciones;
    if (!cd.lastDate || date > cd.lastDate) cd.lastDate = date;

    if (!clientLastDate[client] || date > clientLastDate[client]) clientLastDate[client] = date;
  });

  const allMonths = [...new Set(Object.keys(clientsByMonth))].sort();
  console.log('[consumos] meses:', allMonths);
  console.log('[consumos] clientes únicos:', Object.keys(clientFirstMonth).length, '| filas salteadas:', skipped);
  // Sin meses válidos el archivo no sirve como fuente de CCC — mejor caer a facturación
  if (!allMonths.length) {
    console.warn('[consumos] sin datos válidos — se usa facturación para CCC/retención');
    return null;
  }
  return { clientsByMonth, clientFirstMonth, clientMonthData, clientLastDate, allMonths };
}

// Reconstruye las estructuras del dashboard (Maps, Sets, Dates) desde el JSON pre-procesado
function hydrateVentasJson(j) {
  const scMonthly = new Map(Object.entries(j.scMonthly || {}));
  const mepData   = new Map(Object.entries(j.mepData || {}).map(([k, v]) => [k, Number(v)]));

  const clientsByMonth = {};
  Object.entries(j.clientsByMonth || {}).forEach(([k, names]) => { clientsByMonth[k] = new Set(names); });

  const sucursalesByMonth = {};
  Object.entries(j.sucursalesByMonth || {}).forEach(([k, names]) => { sucursalesByMonth[k] = new Set(names); });

  const clientMonthData = {};
  Object.entries(j.clientMonthData || {}).forEach(([k, clients]) => {
    clientMonthData[k] = {};
    Object.entries(clients).forEach(([name, d]) => {
      clientMonthData[k][name] = {
        netoUsd: Number(d.netoUsd) || 0,
        montoNeto: Number(d.montoNeto) || 0,
        lastPurchase: d.lastPurchase ? new Date(d.lastPurchase) : null,
      };
    });
  });

  const clientLastPurchase = {};
  Object.entries(j.clientLastPurchase || {}).forEach(([name, iso]) => { clientLastPurchase[name] = new Date(iso); });

  const allMonths   = [...scMonthly.keys()].sort();
  const fiscalYears = [...new Set(allMonths.map(k => fiscalYear(k)))].sort((a, b) => b - a);

  return { scMonthly, mepData, clientsByMonth, sucursalesByMonth, clientFirstMonth: j.clientFirstMonth || {}, clientMonthData, clientLastPurchase, fiscalYears, allMonths };
}

// Fallback: parsea el xlsx completo en el navegador (lento — solo si el JSON no está disponible)
function parseVentasWorkbook(ventasBuf) {
  // sheets: limita el parseo a las dos hojas que se usan; sin esto el workbook entero explota en memoria
  const ventasWb = XLSX.read(ventasBuf, { type: 'array', cellDates: true, sheets: ['Base', 'Indices'] });
  const rows = XLSX.utils.sheet_to_json(ventasWb.Sheets['Base'], { defval: '' });
  const scRows = rows.filter(r => String(r['UDN']).trim() === 'Sous Chef');

  const scMonthly          = new Map();
  const clientsByMonth     = {};
  const sucursalesByMonth  = {};
  const clientFirstMonth   = {};
  const clientMonthData    = {};
  const clientLastPurchase = {};

  scRows.forEach(r => {
    const mKey   = periodKey(r['Periodo fiscal']);
    const client = String(r['Fantasia']).trim() || String(r['Cliente']).trim() || 'Sin nombre';
    const sucursal = String(r['Cliente']).trim() || client;
    const usd    = Number(r['Neto u$s'])   || 0;
    const ars    = Number(r['Monto Neto']) || 0;
    const emision = r['Emision'] instanceof Date ? r['Emision'] : new Date(r['Emision']);
    const emOk   = !isNaN(emision);

    if (!scMonthly.has(mKey)) scMonthly.set(mKey, { montoNeto: 0, netoUsd: 0 });
    const sm = scMonthly.get(mKey); sm.montoNeto += ars; sm.netoUsd += usd;

    if (!clientsByMonth[mKey]) clientsByMonth[mKey] = new Set();
    clientsByMonth[mKey].add(client);
    if (!sucursalesByMonth[mKey]) sucursalesByMonth[mKey] = new Set();
    sucursalesByMonth[mKey].add(sucursal);
    if (!clientFirstMonth[client] || mKey < clientFirstMonth[client]) clientFirstMonth[client] = mKey;

    if (!clientMonthData[mKey]) clientMonthData[mKey] = {};
    if (!clientMonthData[mKey][client]) clientMonthData[mKey][client] = { netoUsd: 0, montoNeto: 0, lastPurchase: null };
    const cd = clientMonthData[mKey][client];
    cd.netoUsd += usd; cd.montoNeto += ars;
    if (emOk && (!cd.lastPurchase || emision > cd.lastPurchase)) cd.lastPurchase = emision;
    if (emOk && (!clientLastPurchase[client] || emision > clientLastPurchase[client])) clientLastPurchase[client] = emision;
  });

  const mepData     = ventasWb.Sheets['Indices'] ? parseMEP(ventasWb.Sheets['Indices']) : new Map();
  const allMonths   = [...scMonthly.keys()].sort();
  const fiscalYears = [...new Set(allMonths.map(k => fiscalYear(k)))].sort((a, b) => b - a);

  return { scMonthly, mepData, clientsByMonth, sucursalesByMonth, clientFirstMonth, clientMonthData, clientLastPurchase, fiscalYears, allMonths };
}

async function loadFile(token) {
  setLoading('Cargando datos...');
  try {
    const user = await getUser(token);
    if (user) {
      const initials = ((user.givenName?.[0] || '') + (user.surname?.[0] || '')).toUpperCase() || '?';
      document.getElementById('avatar').textContent = initials;
      document.getElementById('avatar').style.display = 'flex';
      document.getElementById('user-name').textContent = user.displayName || user.userPrincipalName;
    }

    // JSON pre-procesado + consumos, en paralelo
    const [jsonRes, consumosRes] = await Promise.all([
      fetch(DATA_JSON_URL, { headers: { Authorization: 'Bearer ' + token } }).catch(() => null),
      fetchShareFile(token, CONSUMOS_SHARE_URL).catch(() => null),
    ]);

    if (jsonRes && jsonRes.status === 401) { showScreen('login-screen'); return; }

    if (jsonRes && jsonRes.ok) {
      allData = hydrateVentasJson(await jsonRes.json());
      console.log('[ventas] usando resumen JSON pre-procesado');
    } else {
      // Fallback: descargar y parsear el xlsx completo
      console.warn('[ventas] resumen JSON no disponible (status:', jsonRes?.status, ') — usando xlsx completo');
      setLoading('Descargando archivo completo (puede demorar)...');
      const ventasUrl = `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/content`;
      const ventasRes = await fetch(ventasUrl, { headers: { Authorization: 'Bearer ' + token } });
      if (ventasRes.status === 401) { showScreen('login-screen'); return; }
      if (!ventasRes.ok) throw new Error(`Error ventas ${ventasRes.status}: ${ventasRes.statusText}`);
      setLoading('Procesando datos...');
      allData = parseVentasWorkbook(await ventasRes.arrayBuffer());
    }

    const nowKey     = new Date().toISOString().slice(0, 7);
    const completed  = allData.allMonths.filter(k => k < nowKey);
    const defaultKey = completed.length ? completed[completed.length - 1] : allData.allMonths[allData.allMonths.length - 1];

    activeYear     = fiscalYear(defaultKey);
    activeMonthKey = defaultKey;

    // --- Parse consumos file (optional) ---
    if (consumosRes && consumosRes.ok) {
      try {
        const consumosBuf = await consumosRes.arrayBuffer();
        const consumosWb  = XLSX.read(consumosBuf, { type: 'array', cellDates: true });
        consumosData = parseConsumosWorkbook(consumosWb);
      } catch(e) {
        console.warn('Error parseando consumos:', e.message);
        consumosData = null;
      }
    } else {
      console.warn('No se pudo acceder al archivo de consumos:', consumosRes?.status);
      consumosData = null;
    }

    buildDashboard();
  } catch(e) {
    setError('No se pudo cargar el archivo. ' + e.message);
  }
}

// --- Filter state helpers ---
function getActivePeriodKeys() {
  return allData.allMonths.filter(k => {
    if (activeYear !== null && fiscalYear(k) !== activeYear) return false;
    if (activeMonthKey !== null && k !== activeMonthKey) return false;
    return true;
  });
}

function getChartMonths() {
  // All months for the active year (or all) — used for the full-width charts
  return allData.allMonths.filter(k => activeYear === null || fiscalYear(k) === activeYear).sort();
}

// --- KPI calculation ---
// CCC and retention come from consumosData if available, else fall back to allData
function cccSource() {
  return consumosData || allData;
}

function calcKPIs(periodKeys) {
  const src = cccSource();

  const clients = new Set();
  periodKeys.forEach(k => { (src.clientsByMonth[k] || new Set()).forEach(c => clients.add(c)); });
  const ccc = clients.size;

  // CCC sin agrupar: razones sociales únicas (ADP cuenta sus 14 sucursales) — siempre desde ventas
  const sucursales = new Set();
  periodKeys.forEach(k => { ((allData.sucursalesByMonth || {})[k] || new Set()).forEach(c => sucursales.add(c)); });
  const cccSucursales = sucursales.size || null;

  let totalUsd = 0, totalArs = 0;
  periodKeys.forEach(k => {
    const d = allData.scMonthly.get(k) || {};
    totalUsd += d.netoUsd   || 0;
    totalArs += d.montoNeto || 0;
  });

  const clientesNuevos = [...clients].filter(c => periodKeys.includes(src.clientFirstMonth[c])).length;

  let retencion = null, churnPct = null, retenidosN = null, churnN = null;
  if (periodKeys.length === 1) {
    const prevKey = prevMonthKey(periodKeys[0]);
    const prevSet = src.clientsByMonth[prevKey] || new Set();
    if (prevSet.size > 0) {
      const retained = [...prevSet].filter(c => clients.has(c)).length;
      retenidosN = retained;
      churnN     = prevSet.size - retained;
      retencion  = retained / prevSet.size * 100;
      churnPct   = 100 - retencion;
    }
  }

  let tcMep = periodKeys.length === 1 ? (allData.mepData.get(periodKeys[0]) || null) : null;
  if (!tcMep) {
    const mepKeys = [...allData.mepData.keys()].sort();
    if (mepKeys.length) tcMep = allData.mepData.get(mepKeys[mepKeys.length - 1]);
  }

  return { ccc, cccSucursales, totalUsd, totalArs, clientesNuevos, retencion, churnPct, retenidosN, churnN, tcMep };
}

// --- Render ---
function renderAll() {
  const periodKeys = getActivePeriodKeys();
  if (!periodKeys.length) return;

  const kpis = calcKPIs(periodKeys);
  const lbl  = activeMonthKey
    ? periodLabel(activeMonthKey).toUpperCase()
    : activeYear ? `${fyLabel(activeYear)} (acum.)` : 'Acumulado';

  renderKPICards(kpis, lbl);
  renderFacturacionChart(periodKeys);
  renderMovimientosChart();
  renderClientTable(periodKeys);
}

function renderKPICards(kpis, lbl) {
  const { ccc, cccSucursales, totalUsd, totalArs, clientesNuevos, retencion, churnPct, retenidosN, churnN, tcMep } = kpis;

  const card = c => `
    <div class="kpi-card${c.highlight ? ' highlight' : ''}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-main">${c.main}</div>
      ${c.sub ? `<div class="kpi-sub">${c.sub}</div>` : ''}
    </div>`;

  document.getElementById('kpi-row-1').innerHTML = [
    { label: `CCC — ${lbl}`, main: fmtN(ccc), sub: cccSucursales ? `${fmtN(cccSucursales)} puntos de venta (sin agrupar)` : '', highlight: true },
    { label: 'Facturación USD', main: `U$S ${fmtN(Math.round(totalUsd))}`, sub: '' },
    { label: 'Facturación ARS', main: fmtAR(totalArs), sub: '' },
    { label: 'TC MEP', main: tcMep ? `$${fmtN(tcMep)}` : '—', sub: '' },
  ].map(card).join('');

  document.getElementById('kpi-row-2').innerHTML = [
    {
      label: `Clientes nuevos — ${lbl}`,
      main: fmtN(clientesNuevos),
      sub: ccc > 0 ? `${(clientesNuevos / ccc * 100).toFixed(1)}% del total` : '',
    },
    {
      label: '% Retención',
      main: retencion !== null ? `${retencion.toFixed(1)}%` : '—',
      sub: retencion !== null
        ? `${retenidosN} retenidos · ${churnN} churn`
        : 'Seleccioná un mes para ver retención',
    },
  ].map(card).join('');
}

function renderFacturacionChart(periodKeys) {
  document.getElementById('title-facturacion').textContent =
    `Facturación mensual ${currency === 'usd' ? 'U$S' : 'AR$'} + evolución CCC`;

  const months   = getChartMonths();
  const labels   = months.map(periodLabel);
  const factVals = months.map(k => {
    const d = allData.scMonthly.get(k) || {};
    return Math.round(currency === 'usd' ? (d.netoUsd || 0) : (d.montoNeto || 0));
  });
  const cccVals  = months.map(k => (cccSource().clientsByMonth[k] || new Set()).size);
  const bgColors = months.map(k =>
    periodKeys.includes(k) ? 'rgba(29,184,122,0.85)' : 'rgba(29,184,122,0.3)'
  );

  destroyChart('fact');
  charts.fact = new Chart(document.getElementById('chart-facturacion'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: currency === 'usd' ? 'U$S' : 'AR$', data: factVals, backgroundColor: bgColors, borderRadius: 3, yAxisID: 'y' },
        { label: 'CCC', data: cccVals, type: 'line', borderColor: '#3b8ef0', backgroundColor: 'rgba(59,142,240,0.1)', borderWidth: 2, pointRadius: 4, pointBackgroundColor: '#3b8ef0', tension: 0.3, yAxisID: 'y2' },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true, labels: { color: '#8b90a0', font: { size: 11 }, boxWidth: 12 } } },
      scales: {
        x:  { ticks: { color: '#8b90a0', font: { size: 11 }, autoSkip: true, maxRotation: 45 }, grid: { display: false } },
        y:  { ticks: { color: '#8b90a0', font: { size: 11 }, callback: v => currency === 'usd' ? fmtUSD(v) : fmtAR(v) }, grid: { color: '#2e3240' }, position: 'left' },
        y2: { ticks: { color: '#3b8ef0', font: { size: 11 } }, grid: { display: false }, position: 'right' },
      },
    },
  });
}

function renderMovimientosChart() {
  const months = getChartMonths();
  const src    = cccSource();

  const nuevosVals = months.map(k => {
    const cs = src.clientsByMonth[k] || new Set();
    return [...cs].filter(c => src.clientFirstMonth[c] === k).length;
  });

  const churnVals = months.map(k => {
    const prevKey = prevMonthKey(k);
    const prev    = src.clientsByMonth[prevKey] || new Set();
    const curr    = src.clientsByMonth[k]       || new Set();
    return [...prev].filter(c => !curr.has(c)).length;
  });

  destroyChart('mov');
  charts.mov = new Chart(document.getElementById('chart-movimientos'), {
    type: 'bar',
    data: {
      labels: months.map(periodLabel),
      datasets: [
        { label: 'Nuevos',   data: nuevosVals,          backgroundColor: 'rgba(29,184,122,0.75)', borderRadius: 3 },
        { label: 'Churn',    data: churnVals.map(v=>-v), backgroundColor: 'rgba(224,82,82,0.75)',  borderRadius: 3 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: '#8b90a0', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${Math.abs(ctx.raw)}` } },
      },
      scales: {
        x: { ticks: { color: '#8b90a0', font: { size: 11 }, autoSkip: true, maxRotation: 45 }, grid: { display: false } },
        y: { ticks: { color: '#8b90a0', font: { size: 11 }, callback: v => Math.abs(v) }, grid: { color: '#2e3240' } },
      },
    },
  });
}

function renderClientTable(periodKeys) {
  const src   = cccSource();  // consumosData if available, else allData
  const today = new Date();

  // --- Clients that were active in the period (from primary source) ---
  const activeInPeriod = new Set();
  periodKeys.forEach(k => (src.clientsByMonth[k] || new Set()).forEach(c => activeInPeriod.add(c)));

  // Build per-client aggregated data
  const clientData = {};
  activeInPeriod.forEach(name => {
    clientData[name] = { raciones: 0, netoUsd: 0, montoNeto: 0, lastDate: null };
  });

  periodKeys.forEach(mKey => {
    // Raciones from consumos (if available)
    if (consumosData) {
      Object.entries(consumosData.clientMonthData[mKey] || {}).forEach(([name, d]) => {
        if (!clientData[name]) return;
        clientData[name].raciones += d.raciones;
        if (d.lastDate && (!clientData[name].lastDate || d.lastDate > clientData[name].lastDate))
          clientData[name].lastDate = d.lastDate;
      });
    }
    // Billing from ventas
    Object.entries(allData.clientMonthData[mKey] || {}).forEach(([name, d]) => {
      if (!clientData[name]) return;
      clientData[name].netoUsd   += d.netoUsd;
      clientData[name].montoNeto += d.montoNeto;
      if (d.lastPurchase && (!clientData[name].lastDate || d.lastPurchase > clientData[name].lastDate))
        clientData[name].lastDate = d.lastPurchase;
    });
  });

  // Sort by raciones (consumos) or USD (ventas)
  const sorted = Object.entries(clientData).sort((a, b) =>
    consumosData ? b[1].raciones - a[1].raciones : b[1].netoUsd - a[1].netoUsd
  );

  function getBuyerTag(name) {
    if (periodKeys.length === 1) {
      return src.clientFirstMonth[name] === periodKeys[0]
        ? '<span class="tag tag-nuevo">Nuevo</span>'
        : '<span class="tag tag-activo">Activo</span>';
    }
    const last = consumosData ? consumosData.clientLastDate[name] : allData.clientLastPurchase[name];
    if (!last) return '';
    const days = (today - last) / 86400000;
    if (days <= 30) return '<span class="tag tag-activo">Activo</span>';
    if (days <= 90) return '<span class="tag tag-inactivo">Inactivo</span>';
    return '<span class="tag tag-churn">Churn</span>';
  }

  // --- Clients that exist in history but NOT active this period ---
  const allKnown = Object.keys(src.clientFirstMonth);
  const nonBuyers = allKnown
    .filter(name => !activeInPeriod.has(name))
    .map(name => {
      const last = consumosData ? consumosData.clientLastDate[name] : allData.clientLastPurchase[name];
      const days = last ? (today - last) / 86400000 : Infinity;
      const tag  = days <= 90
        ? '<span class="tag tag-inactivo">Inactivo</span>'
        : '<span class="tag tag-churn">Churn</span>';
      return { name, last, days, tag };
    })
    .sort((a, b) => a.days - b.days);


  const showRaciones = !!consumosData;
  const colSpan = showRaciones ? 7 : 6;

  document.getElementById('title-clientes').textContent =
    `Clientes del período — ${sorted.length} CCC · ${nonBuyers.length} sin compra` +
    (consumosData ? ' · consumos ✓' : ' · solo facturación');

  const thead = `<thead><tr>
    <th>#</th><th>Cliente</th><th></th>
    ${showRaciones ? '<th>Raciones</th>' : ''}
    <th>Fact. USD</th><th>Fact. ARS</th>
    <th>Último registro</th>
  </tr></thead>`;

  const buyerRows = sorted.map(([name, d], i) => `
    <tr>
      <td class="idx">${i + 1}</td>
      <td>${name}</td>
      <td>${getBuyerTag(name)}</td>
      ${showRaciones ? `<td>${fmtN(Math.round(d.raciones))}</td>` : ''}
      <td>${d.netoUsd ? 'U$S ' + fmtN(Math.round(d.netoUsd)) : '—'}</td>
      <td>${d.montoNeto ? fmtAR(d.montoNeto) : '—'}</td>
      <td>${fmtDate(d.lastDate)}</td>
    </tr>`).join('');

  const sepRow = nonBuyers.length ? `
    <tr class="sep"><td colspan="${colSpan}">Sin compra en el período (${nonBuyers.length})</td></tr>` : '';

  const nonBuyerRows = nonBuyers.map(({ name, last, tag }, i) => `
    <tr class="no-compra">
      <td class="idx">${sorted.length + i + 1}</td>
      <td>${name}</td>
      <td>${tag}</td>
      ${showRaciones ? '<td>—</td>' : ''}
      <td>—</td><td>—</td>
      <td>${fmtDate(last)}</td>
    </tr>`).join('');

  document.getElementById('tabla-clientes').innerHTML =
    thead + `<tbody>${buyerRows}${sepRow}${nonBuyerRows}</tbody>`;
}

// --- Dashboard setup ---
function buildDashboard() {
  renderYearFilters();
  renderMonthFilters();
  renderAll();
  showScreen('report-screen');
}

function renderYearFilters() {
  const container = document.getElementById('year-filters');
  container.innerHTML = '';

  allData.fiscalYears.forEach(fy => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (fy === activeYear ? ' active' : '');
    btn.textContent = fyLabel(fy);
    btn.onclick = () => {
      activeYear     = fy;
      activeMonthKey = null;
      document.querySelectorAll('#year-filters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMonthFilters();
      renderAll();
    };
    container.appendChild(btn);
  });

  if (allData.fiscalYears.length > 1) {
    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn' + (activeYear === null ? ' active' : '');
    allBtn.textContent = 'Todos';
    allBtn.onclick = () => {
      activeYear     = null;
      activeMonthKey = null;
      document.querySelectorAll('#year-filters .filter-btn').forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
      renderMonthFilters();
      renderAll();
    };
    container.appendChild(allBtn);
  }
}

function renderMonthFilters() {
  const section   = document.getElementById('month-filter-section');
  const container = document.getElementById('month-filters');

  if (activeYear === null) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'flex';

  const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const available = allData.allMonths.filter(k => fiscalYear(k) === activeYear).sort();
  container.innerHTML = '';

  const todosBtn = document.createElement('button');
  todosBtn.className = 'filter-btn' + (activeMonthKey === null ? ' active' : '');
  todosBtn.textContent = 'Todos';
  todosBtn.onclick = () => {
    activeMonthKey = null;
    document.querySelectorAll('#month-filters .filter-btn').forEach(b => b.classList.remove('active'));
    todosBtn.classList.add('active');
    renderAll();
  };
  container.appendChild(todosBtn);

  available.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (k === activeMonthKey ? ' active' : '');
    btn.textContent = MONTHS[parseInt(k.slice(5)) - 1];
    btn.onclick = () => {
      activeMonthKey = k;
      document.querySelectorAll('#month-filters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    };
    container.appendChild(btn);
  });
}

function setCurrency(cur) {
  currency = cur;
  document.getElementById('btn-usd').classList.toggle('active', cur === 'usd');
  document.getElementById('btn-ars').classList.toggle('active', cur === 'ars');
  if (allData) renderAll();
}

function destroyChart(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
}

(async () => {
  const handled = await handleCallback();
  if (!handled) {
    const stored = sessionStorage.getItem('ms_token');
    if (stored) loadFile(stored); else showScreen('login-screen');
  }
})();
</script>
